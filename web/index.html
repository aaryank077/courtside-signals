<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Courtside</title>
<style>
  :root {
    --bg: #f7f5f2;
    --surface: #ffffff;
    --text: #1c1b19;
    --muted: #6b675f;
    --border: #e4e0d8;
    --accent: #d9622b;
    --accent-soft: #fbe9df;
    --row-alt: #faf8f5;
    --error: #b42318;
    --shadow: 0 1px 2px rgba(28, 27, 25, .06), 0 4px 16px rgba(28, 27, 25, .06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141312;
      --surface: #1d1c1a;
      --text: #f2efe9;
      --muted: #a29d93;
      --border: #33312d;
      --accent: #f0814a;
      --accent-soft: #3a2519;
      --row-alt: #22201e;
      --error: #f97066;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
  }
  main { max-width: 860px; margin: 0 auto; padding: 48px 16px 80px; }

  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 28px; }
  .brand svg { flex: none; }
  .brand h1 { font-size: 22px; letter-spacing: -.01em; margin: 0; }
  .brand span { color: var(--muted); font-size: 14px; }

  form { display: flex; gap: 8px; }
  input[type=search] {
    flex: 1; min-width: 0;
    font: inherit; font-size: 18px;
    padding: 14px 16px;
    border: 1px solid var(--border); border-radius: 12px;
    background: var(--surface); color: var(--text);
    box-shadow: var(--shadow);
  }
  input[type=search]:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  button.ask {
    font: inherit; font-weight: 600;
    padding: 0 22px; border: 0; border-radius: 12px;
    background: var(--accent); color: #fff; cursor: pointer;
  }
  button.ask:disabled { opacity: .6; cursor: wait; }

  .examples { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 0; padding: 0; list-style: none; }
  .examples button {
    font: inherit; font-size: 13px;
    padding: 6px 12px; border-radius: 999px;
    border: 1px solid var(--border); background: transparent; color: var(--muted);
    cursor: pointer;
  }
  .examples button:hover { color: var(--text); border-color: var(--accent); }

  .result { margin-top: 36px; }
  .status { color: var(--muted); display: flex; align-items: center; gap: 10px; }
  .spinner {
    width: 16px; height: 16px; border-radius: 50%;
    border: 2px solid var(--border); border-top-color: var(--accent);
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
    padding: 24px; box-shadow: var(--shadow);
  }
  .question { color: var(--muted); font-size: 14px; margin: 0 0 8px; }
  .answer { font-size: 24px; line-height: 1.35; font-weight: 600; letter-spacing: -.01em; margin: 0; }
  .detail { margin: 10px 0 0; color: var(--muted); font-size: 16px; }
  .answer.error { color: var(--error); font-size: 18px; font-weight: 500; }
  .tag {
    display: inline-block; margin-top: 14px;
    font-size: 12px; color: var(--accent); background: var(--accent-soft);
    padding: 2px 8px; border-radius: 6px;
  }

  .table-wrap { margin-top: 20px; overflow-x: auto; border: 1px solid var(--border); border-radius: 12px; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; font-variant-numeric: tabular-nums; }
  th, td { padding: 9px 12px; text-align: left; white-space: nowrap; }
  th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); border-bottom: 1px solid var(--border); }
  td.num, th.num { text-align: right; }
  tbody tr:nth-child(even) { background: var(--row-alt); }
  th.key, td.key { color: var(--accent); font-weight: 600; }
  .more { font-size: 13px; color: var(--muted); padding: 10px 12px; }
  .more button { font: inherit; color: var(--accent); background: none; border: 0; cursor: pointer; padding: 0; }

  .chart { margin-top: 20px; }
  .chart svg { width: 100%; height: auto; display: block; overflow: visible; }
  .chart .axis { font-size: 11px; fill: var(--muted); }
  .chart .grid { stroke: var(--border); stroke-width: 1; }
  .chart .raw { fill: var(--muted); opacity: .45; }
  .chart .line { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linejoin: round; }
  .chart .bar { fill: var(--accent); }
  .chart .bar:hover, .chart .raw:hover { opacity: 1; }
  .legend { display: flex; gap: 16px; font-size: 12px; color: var(--muted); margin-top: 6px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }

  .history { margin-top: 40px; }
  .history h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 0 0 8px; }
  .history ul { list-style: none; margin: 0; padding: 0; }
  .history button {
    font: inherit; font-size: 14px; text-align: left; width: 100%;
    background: none; border: 0; color: var(--text); cursor: pointer;
    padding: 6px 0; border-bottom: 1px solid var(--border);
  }
  .history button:hover { color: var(--accent); }

  .hint { color: var(--muted); font-size: 14px; margin: 12px 0 0; }
  .hint ul { margin: 6px 0 0; padding-left: 18px; }

  @media (max-width: 560px) {
    main { padding-top: 28px; }
    .brand span { display: none; }
    .examples { flex-wrap: nowrap; overflow-x: auto; margin-right: -16px; padding-right: 16px; scrollbar-width: none; }
    .examples button { white-space: nowrap; }
    .answer { font-size: 20px; }
    button.ask { padding: 0 16px; }
  }
</style>
</head>
<body>
<main>
  <div class="brand">
    <svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true">
      <circle cx="16" cy="16" r="14" fill="var(--accent)"/>
      <path d="M2 16h28M16 2v28M6.5 6.5c5 4 5 15 0 19M25.5 6.5c-5 4-5 15 0 19" stroke="var(--surface)" stroke-width="1.6" fill="none"/>
    </svg>
    <h1>Courtside</h1>
    <span>ask anything about NBA stats</span>
  </div>

  <form id="form">
    <input id="q" type="search" autocomplete="off" autofocus
           placeholder="How many 30-point games does Luka have against the Lakers?" aria-label="Question">
    <button class="ask" id="go" type="submit">Ask</button>
  </form>
  <ul class="examples" id="examples"></ul>

  <section class="result" id="result" aria-live="polite"></section>
  <section class="history" id="history" hidden>
    <h2>Recent</h2>
    <ul id="history-list"></ul>
  </section>
</main>

<script>
const EXAMPLES = [
  "Curry vs Luka points per game",
  "Who leads the league in assists?",
  "Jokic's longest streak of triple-doubles",
  "LeBron career high",
  "What's Luka's record when he scores 40+?",
  "How has Wembanyama played lately?",
  "Are superstars older now than earlier?",
  "Oldest All-NBA players",
  "Will anyone beat Curry's 3-point record?",
];

const LABELS = {
  game_date: "Date", season: "Season", matchup: "Matchup", wl: "W/L", gp: "GP",
  player: "Player", player_name: "Player", team_abbreviation: "Team", rank: "#",
  mpg: "MPG", pts: "PTS", reb: "REB", ast: "AST", stl: "STL", blk: "BLK", tov: "TOV",
  min: "MIN", fgm: "FGM", fga: "FGA", fg3m: "3PM", fg3a: "3PA", ftm: "FTM", fta: "FTA",
  oreb: "OREB", dreb: "DREB", pf: "PF", plus_minus: "+/-",
  fg_pct: "FG%", fg3_pct: "3P%", ft_pct: "FT%", win_pct: "Win %",
  w: "W", l: "L", stat: "Stat", total: "Total", per_game: "Per game", pct: "Pct",
  age: "Age", team: "Team", era: "Era", selections: "Selections", avg_age: "Avg age",
  first_team: "1st team", first_season: "First", last_season: "Last",
  first_all_nba: "First All-NBA", players: "Players", avg_seasons: "Avg seasons",
  active: "Active", behind: "Behind", per_season: "Per season (last 3)",
  seasons_needed: "Seasons to pass", age_at_record: "Age then",
};
const PCT = new Set(["fg_pct", "fg3_pct", "ft_pct", "pct"]);
const ROWS_SHOWN = 15;

const $ = (id) => document.getElementById(id);
const form = $("form"), input = $("q"), go = $("go"), result = $("result");

function label(col) {
  if (LABELS[col]) return LABELS[col];
  if (col.endsWith("_pg")) return (LABELS[col.slice(0, -3)] || col) + "/G";
  return col.replace(/_/g, " ");
}

function format(col, v) {
  if (v === null || v === undefined) return "–";
  if (typeof v !== "number") return String(v);
  if (PCT.has(col)) return (v * 100).toFixed(1) + "%";
  if (col === "win_pct") return v.toFixed(3).replace(/^0/, "");
  return Number.isInteger(v) ? v.toLocaleString() : v.toFixed(1);
}

function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") node.className = v;
    else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
    else node.setAttribute(k, v);
  }
  for (const c of children) if (c != null) node.append(c);
  return node;
}

function keyColumn(data) {
  const stat = data.params && data.params.stat;
  if (!stat) return null;
  return data.columns.find((c) => c === stat + "_pg") || data.columns.find((c) => c === stat) || null;
}

function renderTable(data) {
  const key = keyColumn(data);
  const numeric = data.columns.map((_, i) => data.rows.some((r) => typeof r[i] === "number"));
  const cls = (i, c) => [numeric[i] ? "num" : "", c === key ? "key" : ""].join(" ").trim();

  const tbody = el("tbody");
  const addRows = (rows) => rows.forEach((row) =>
    tbody.append(el("tr", {}, ...row.map((v, i) =>
      el("td", { class: cls(i, data.columns[i]) }, format(data.columns[i], v))))));
  addRows(data.rows.slice(0, ROWS_SHOWN));

  const wrap = el("div", { class: "table-wrap" },
    el("table", {},
      el("thead", {}, el("tr", {}, ...data.columns.map((c, i) => el("th", { class: cls(i, c) }, label(c))))),
      tbody));

  if (data.rows.length > ROWS_SHOWN) {
    const more = el("div", { class: "more" },
      `${data.rows.length - ROWS_SHOWN} more rows · `,
      el("button", { type: "button", onclick: () => { addRows(data.rows.slice(ROWS_SHOWN)); more.remove(); } }, "Show all"));
    wrap.append(more);
  }
  return wrap;
}

const SVG = "http://www.w3.org/2000/svg";
function svg(tag, attrs = {}, text) {
  const node = document.createElementNS(SVG, tag);
  for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
  if (text != null) node.textContent = text;
  return node;
}

function renderChart(chart) {
  const W = 720, H = 240, L = 40, R = 8, T = 10, B = 28;
  const ys = chart.y.concat(chart.y_smooth || []).filter((v) => v != null);
  let lo = Math.min(...ys), hi = Math.max(...ys);
  if (chart.type === "bar") lo = 0;
  const pad = (hi - lo) * 0.1 || 1;
  lo = chart.type === "bar" ? 0 : Math.floor(lo - pad); hi = Math.ceil(hi + pad);
  const n = chart.x.length;
  const xAt = (i) => L + (n === 1 ? (W - L - R) / 2 : i * (W - L - R) / (n - 1));
  const yAt = (v) => T + (hi - v) * (H - T - B) / (hi - lo);
  const root = svg("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": chart.y_label });

  // round tick steps: 1, 2, 5, 10, 20, ...
  const raw = (hi - lo) / 4, mag = 10 ** Math.floor(Math.log10(raw));
  const step = [1, 2, 5, 10].map((m) => m * mag).find((s) => s >= raw);
  for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) {
    const y = yAt(v);
    root.append(svg("line", { class: "grid", x1: L, x2: W - R, y1: y, y2: y }));
    root.append(svg("text", { class: "axis", x: L - 6, y: y + 4, "text-anchor": "end" }, +v.toFixed(2)));
  }

  if (chart.type === "bar") {
    const slot = (W - L - R) / n, bw = Math.min(48, slot * 0.6);
    chart.x.forEach((label, i) => {
      const cx = L + slot * (i + 0.5);
      const bar = svg("rect", { class: "bar", x: cx - bw / 2, y: yAt(chart.y[i]), width: bw,
                                height: yAt(lo) - yAt(chart.y[i]), rx: 3 });
      bar.append(svg("title", {}, `${label}: ${chart.y[i]}`));
      root.append(bar);
      root.append(svg("text", { class: "axis", x: cx, y: H - 8, "text-anchor": "middle" }, label));
    });
  } else {
    chart.x.forEach((label, i) => {
      const dot = svg("circle", { class: "raw", cx: xAt(i), cy: yAt(chart.y[i]), r: 2.5 });
      dot.append(svg("title", {}, `${label}: ${chart.y[i]}`));
      root.append(dot);
      // label the first season of each decade
      if (/^\d{3}0-/.test(label))
        root.append(svg("text", { class: "axis", x: xAt(i), y: H - 8, "text-anchor": "middle" }, label.slice(0, 4)));
    });
    if (chart.y_smooth) {
      const d = chart.y_smooth.map((v, i) => `${i ? "L" : "M"}${xAt(i).toFixed(1)},${yAt(v).toFixed(1)}`).join("");
      root.append(svg("path", { class: "line", d }));
    }
  }

  const legend = el("div", { class: "legend" },
    el("span", {}, el("i", { style: `background: var(${chart.type === "bar" ? "--accent" : "--muted"})` }),
      chart.type === "bar" ? chart.y_label : "Each season"));
  if (chart.y_smooth) legend.append(el("span", {}, el("i", { style: "background: var(--accent)" }), chart.smooth_label));
  return el("div", { class: "chart" }, root, legend);
}

function render(data) {
  const unknown = data.category === "unknown";
  // long answers: first sentence as the headline, the rest as normal text
  let headline = data.answer, detail = "";
  const split = data.answer.search(/\.\s+[A-Z]/);
  if (data.answer.length > 110 && split > 0) {
    headline = data.answer.slice(0, split + 1);
    detail = data.answer.slice(split + 1).trim();
  }
  const card = el("div", { class: "card" },
    el("p", { class: "question" }, data.question),
    el("p", { class: "answer" + (data.rows.length || !unknown ? "" : " error") }, headline));
  if (detail) card.append(el("p", { class: "detail" }, detail));
  if (!unknown) card.append(el("span", { class: "tag" }, data.category.replace(/_/g, " ")));
  if (unknown) card.append(el("div", { class: "hint" }, "Try asking about:",
    el("ul", {}, ...[
      "a player's averages, optionally vs a team or in a season",
      "how many games a player has with 30+ points, triple-doubles, etc.",
      "best seasons, career highs, career totals, streaks, or records",
      "comparing two players, or who leads the league in a stat",
      "All-NBA history: ages over time, oldest and youngest, most selections, career length",
    ].map((t) => el("li", {}, t)))));
  if (data.chart) card.append(renderChart(data.chart));
  if (data.rows.length) card.append(renderTable(data));
  result.replaceChildren(card);
}

function renderError(question, message) {
  result.replaceChildren(el("div", { class: "card" },
    el("p", { class: "question" }, question),
    el("p", { class: "answer error" }, message)));
}

let history = [];
try { history = JSON.parse(localStorage.getItem("courtside-history") || "[]"); } catch {}

function remember(q) {
  history = [q, ...history.filter((h) => h !== q)].slice(0, 8);
  try { localStorage.setItem("courtside-history", JSON.stringify(history)); } catch {}
  renderHistory();
}

function renderHistory() {
  $("history").hidden = history.length === 0;
  $("history-list").replaceChildren(...history.map((h) =>
    el("li", {}, el("button", { type: "button", onclick: () => askQuestion(h) }, h))));
}

async function askQuestion(q) {
  q = q.trim();
  if (!q) return;
  input.value = q;
  go.disabled = true;
  const status = el("p", { class: "status" }, el("span", { class: "spinner" }), "Looking it up…");
  result.replaceChildren(status);
  // a player we've never seen gets their whole career fetched, which takes a bit
  const slow = setTimeout(() => status.lastChild.replaceWith(
    "Fetching this player's career for the first time, this can take up to 30 seconds…"), 2500);

  const url = new URL(location);
  url.searchParams.set("q", q);
  history_replace(url);

  try {
    const res = await fetch("/api/ask?q=" + encodeURIComponent(q));
    const data = await res.json();
    if (!res.ok) renderError(q, data.error || "Something went wrong.");
    else { render(data); if (data.category !== "unknown") remember(q); }
  } catch {
    renderError(q, "Couldn't reach the server. Is server.py still running?");
  } finally {
    clearTimeout(slow);
    go.disabled = false;
  }
}

function history_replace(url) {
  try { window.history.replaceState(null, "", url); } catch {}
}

form.addEventListener("submit", (e) => { e.preventDefault(); askQuestion(input.value); });
$("examples").replaceChildren(...EXAMPLES.map((ex) =>
  el("li", {}, el("button", { type: "button", onclick: () => askQuestion(ex) }, ex))));
renderHistory();

const initial = new URLSearchParams(location.search).get("q");
if (initial) askQuestion(initial);
</script>
</body>
</html>
